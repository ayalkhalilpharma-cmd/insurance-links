<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mena's Online Directory</title>
    <style>
        :root {
            --bg-color: #f1f5f9;
            --text-main: #1e293b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 30px;
            padding-bottom: 40px;
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        header h1 {
            font-size: 2.3rem;
            color: #334155;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Mode Toggle Button */
        .mode-toggle-btn {
            background-color: #0f172a;
            color: #f8fafc;
            border: 2px solid #334155;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mode-toggle-btn:hover {
            background-color: #334155;
            transform: translateY(-2px);
        }

        /* Honeycomb Flex Layout */
        .honeycomb-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 20px;
            max-width: 1150px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Shadow Wrapper for Hexagons */
        .hex-wrapper {
            filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.15));
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .hex-wrapper:hover {
            transform: scale(1.12) translateY(-8px);
            filter: drop-shadow(0 15px 20px rgba(0, 0, 0, 0.3));
            z-index: 10;
        }

        /* The Hexagon Button Shape */
        .visit-btn {
            width: 170px;
            height: 195px;
            background-color: var(--clr);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            padding: 0 15px;
            line-height: 1.3;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: filter 0.3s;
        }

        .hex-wrapper:hover .visit-btn {
            filter: brightness(1.15);
        }

        /* Retro Telephone Buttons */
        .phone-wrapper {
            filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.15));
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 170px;
            height: 195px;
        }

        .phone-wrapper:hover {
            transform: scale(1.15) translateY(-8px);
            filter: drop-shadow(0 15px 20px rgba(0, 0, 0, 0.3));
            z-index: 10;
        }

        .retro-phone {
            width: 155px;
            height: 155px;
            color: var(--phone-clr);
            transition: filter 0.3s;
        }

        .phone-wrapper:hover .retro-phone {
            filter: brightness(1.2);
        }

        /* F1 Keyboard Button Styles */
        .key-wrapper {
            width: 170px; 
            height: 195px;
            display: flex; 
            align-items: center; 
            justify-content: center;
            cursor: pointer;
            filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.2));
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .key-wrapper:hover {
            transform: scale(1.15);
            filter: drop-shadow(0 15px 20px rgba(0, 0, 0, 0.3));
            z-index: 10;
        }

        .key-3d {
            width: 110px; 
            height: 110px;
            background: linear-gradient(135deg, #f1f5f9, #cbd5e1);
            border-radius: 12px;
            border: 2px solid #94a3b8;
            box-shadow: 0 10px 0 #94a3b8, 0 12px 10px rgba(0,0,0,0.2), inset 2px 2px 5px rgba(255,255,255,0.8);
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-size: 3rem; 
            font-weight: 900; 
            font-family: Arial, sans-serif;
            color: #334155;
            transition: all 0.1s;
            text-decoration: none;
        }

        .key-wrapper:hover .key-3d {
            transform: translateY(6px);
            box-shadow: 0 4px 0 #94a3b8, 0 4px 4px rgba(0,0,0,0.2), inset 2px 2px 5px rgba(255,255,255,0.8);
            background: linear-gradient(135deg, #ffffff, #e2e8f0);
            color: #0284c7;
        }

        /* Dx and Rx Text Shapes */
        .dx-rx-wrapper {
            width: 170px; 
            height: 195px;
            display: flex; 
            align-items: center; 
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .dx-rx-wrapper:hover {
            transform: scale(1.15) translateY(-8px);
            z-index: 10;
        }

        .symbol-text {
            font-family: 'Georgia', serif;
            font-size: 5.5rem;
            font-weight: bold;
            font-style: italic;
            color: var(--sym-clr);
            text-decoration: none;
            display: flex;
            align-items: flex-end;
            line-height: 1;
            filter: drop-shadow(0 6px 8px rgba(0,0,0,0.2));
            transition: all 0.3s;
        }

        .symbol-text sub {
            font-size: 3.5rem;
            margin-left: -5px;
            margin-bottom: 8px;
        }

        .dx-rx-wrapper:hover .symbol-text {
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3)) brightness(1.2);
            text-shadow: 0 0 20px var(--sym-clr);
        }

        /* Custom Lab, WhatsApp & Notes Wrappers */
        .custom-shape-wrapper {
            width: 170px;
            height: 195px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.15));
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .custom-shape-wrapper:hover {
            transform: scale(1.15) translateY(-8px);
            filter: drop-shadow(0 15px 20px rgba(0, 0, 0, 0.3));
            z-index: 10;
        }

        .custom-svg {
            width: 150px;
            height: 150px;
            transition: filter 0.3s;
        }

        .custom-shape-wrapper:hover .custom-svg {
            filter: brightness(1.18);
        }

        /* Center Clock Hexagon */
        .clock-wrapper {
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.1));
            margin: 10px 25px;
            z-index: 5;
        }

        .clock-hex {
            width: 300px;
            height: 345px;
            background-color: #ffffff;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        #clock-time {
            font-size: 2.8rem;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -1px;
            margin-bottom: 5px;
        }

        #clock-day {
            font-size: 1.4rem;
            font-weight: 700;
            color: #3b82f6; 
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        #clock-date {
            font-size: 1.1rem;
            color: #64748b;
            margin-top: 5px;
            font-weight: 600;
        }

        /* Tooltip Styles */
        .quote-tooltip {
            position: fixed;
            background-color: #1e293b;
            color: #f8fafc;
            padding: 0.85rem 1.2rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            transform: translate(-50%, -100%) translateY(10px);
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            width: max-content;
            max-width: 280px;
            line-height: 1.5;
        }

        .quote-tooltip.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -100%) translateY(0);
        }

        /* Howling Direwolf Container (Hidden by default) */
        .wolf-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 45px;
            opacity: 0.85;
            transition: opacity 0.3s;
        }

        .wolf-container:hover {
            opacity: 1;
        }

        .wolf-svg {
            width: 170px;
            height: 170px;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.5));
        }

        /* =========================================================
           AHMEDELDEEB MODE (Eye-Comforting Blackboard Theme)
           ========================================================= */
        body.ahmedeldeeb-mode {
            background-color: #121417 !important;
            color: #e2e8f0 !important;
        }

        body.ahmedeldeeb-mode header h1 {
            color: #f1f5f9 !important;
            letter-spacing: 2px;
            font-family: 'Courier New', Courier, monospace, sans-serif;
        }

        body.ahmedeldeeb-mode .mode-toggle-btn {
            background-color: #22272e;
            color: #38bdf8;
            border-color: #38bdf8;
        }

        body.ahmedeldeeb-mode .honeycomb-grid {
            gap: 14px;
            max-width: 1000px;
        }

        /* Rectangular Button Sizes */
        body.ahmedeldeeb-mode .hex-wrapper,
        body.ahmedeldeeb-mode .phone-wrapper,
        body.ahmedeldeeb-mode .key-wrapper,
        body.ahmedeldeeb-mode .dx-rx-wrapper,
        body.ahmedeldeeb-mode .custom-shape-wrapper {
            width: 210px !important;
            height: 56px !important;
            filter: none !important;
            transform: none !important;
        }

        body.ahmedeldeeb-mode .hex-wrapper:hover,
        body.ahmedeldeeb-mode .phone-wrapper:hover,
        body.ahmedeldeeb-mode .key-wrapper:hover,
        body.ahmedeldeeb-mode .dx-rx-wrapper:hover,
        body.ahmedeldeeb-mode .custom-shape-wrapper:hover {
            transform: translateY(-2px) !important;
            filter: none !important;
        }

        /* Uniform Simple Blackboard Buttons */
        body.ahmedeldeeb-mode .visit-btn,
        body.ahmedeldeeb-mode .phone-wrapper a,
        body.ahmedeldeeb-mode .key-wrapper a,
        body.ahmedeldeeb-mode .dx-rx-wrapper a,
        body.ahmedeldeeb-mode .custom-shape-wrapper a {
            width: 100% !important;
            height: 100% !important;
            clip-path: none !important;
            background: #1c2128 !important;
            border: 1px solid #444c56 !important;
            border-radius: 8px !important;
            color: #e6edf3 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            font-family: 'Segoe UI', Arial, sans-serif !important;
            font-size: 0.98rem !important;
            font-weight: 600 !important;
            text-transform: none !important;
            letter-spacing: 0.5px !important;
            box-shadow: none !important;
            text-decoration: none !important;
            padding: 0 12px !important;
            text-align: center !important;
            box-sizing: border-box !important;
        }

        body.ahmedeldeeb-mode .visit-btn:hover,
        body.ahmedeldeeb-mode .phone-wrapper a:hover,
        body.ahmedeldeeb-mode .key-wrapper a:hover,
        body.ahmedeldeeb-mode .dx-rx-wrapper a:hover,
        body.ahmedeldeeb-mode .custom-shape-wrapper a:hover {
            background: #2d333b !important;
            border-color: #768390 !important;
            color: #ffffff !important;
        }

        /* Hide SVGs and complex graphics in Blackboard Mode */
        body.ahmedeldeeb-mode [data-label] * {
            display: none !important;
        }

        /* Display simple clean text labels for icon buttons */
        body.ahmedeldeeb-mode [data-label]::after {
            content: attr(data-label);
            display: block;
            font-size: 0.98rem;
            color: #e6edf3;
            font-weight: 600;
            font-style: normal;
        }

        /* Simplified Clock for Ahmedeldeeb Mode */
        body.ahmedeldeeb-mode .clock-wrapper {
            margin: 10px 0 !important;
            filter: none !important;
            width: 100% !important;
            display: flex !important;
            justify-content: center !important;
        }

        body.ahmedeldeeb-mode .clock-hex {
            width: 440px !important;
            height: auto !important;
            padding: 12px 20px !important;
            background-color: #1c2128 !important;
            border: 1px solid #444c56 !important;
            border-radius: 8px !important;
            clip-path: none !important;
        }

        body.ahmedeldeeb-mode #clock-time {
            font-size: 1.7rem !important;
            color: #38bdf8 !important;
            margin-bottom: 2px !important;
        }

        body.ahmedeldeeb-mode #clock-day {
            font-size: 0.95rem !important;
            color: #94a3b8 !important;
        }

        body.ahmedeldeeb-mode #clock-date {
            font-size: 0.85rem !important;
            color: #64748b !important;
            margin-top: 2px !important;
        }

        /* Display Howling Direwolf in Ahmedeldeeb Mode */
        body.ahmedeldeeb-mode .wolf-container {
            display: flex;
        }
    </style>

    <!-- Hidden Tooltip Element for Quotes -->
    <div id="quote-tooltip" class="quote-tooltip"></div>

    <script>
        function updateClock() {
            const now = new Date();
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

            let h = now.getHours();
            let m = now.getMinutes();
            let s = now.getSeconds();
            let ampm = h >= 12 ? 'PM' : 'AM';
            
            h = h % 12;
            h = h ? h : 12;
            m = m < 10 ? '0' + m : m;
            s = s < 10 ? '0' + s : s;

            document.getElementById('clock-time').textContent = `${h}:${m}:${s} ${ampm}`;
            document.getElementById('clock-day').textContent = days[now.getDay()];
            document.getElementById('clock-date').textContent = `${now.getDate()} ${months[now.getMonth()]}, ${now.getFullYear()}`;
        }
        
        updateClock();
        setInterval(updateClock, 1000);

        /* Ahmedeldeeb Mode Toggle Script */
        function toggleAhmedeldeebMode() {
            document.body.classList.toggle('ahmedeldeeb-mode');
            const isModeOn = document.body.classList.contains('ahmedeldeeb-mode');
            localStorage.setItem('ahmedeldeebMode', isModeOn ? 'enabled' : 'disabled');
            
            const btn = document.getElementById('mode-toggle');
            btn.innerHTML = isModeOn ? '<span>☀️ Normal Mode</span>' : '<span>✏️ Ahmedeldeeb Mode</span>';
        }

        // Check stored mode state on page load
        if (localStorage.getItem('ahmedeldeebMode') === 'enabled') {
            document.body.classList.add('ahmedeldeeb-mode');
            document.getElementById('mode-toggle').innerHTML = '<span>☀️ Normal Mode</span>';
        }

        const quotes = [
            "“The secret of getting ahead is getting started.”",
            "“Hard work beats talent when talent doesn't work hard.”",
            "“Don't watch the clock; do what it does. Keep going.”",
            "“Success is no accident. It is hard work and learning.”",
            "“Believe you can and you're halfway there.”",
            "“Your limitation—it's only your imagination.”",
            "“Push yourself, because no one else is going to do it for you.”",
            "“Great things never come from comfort zones.”",
            "“Dream it. Wish it. Do it.”",
            "“Stay focused, stay positive, and never give up.”"
        ];

        const tooltip = document.getElementById('quote-tooltip');
        const interactiveItems = document.querySelectorAll('.honeycomb-grid > div:not(.clock-wrapper)');

        interactiveItems.forEach(item => {
            item.addEventListener('mouseenter', () => {
                if (document.body.classList.contains('ahmedeldeeb-mode')) return; // Disable hover tooltips in eye-comfort mode
                
                const title = item.getAttribute('data-title');
                const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
                
                tooltip.innerHTML = `<strong style="color: #60a5fa; display: block; margin-bottom: 4px;">${title}</strong>${randomQuote}`;
                tooltip.classList.add('show');
                
                const rect = item.getBoundingClientRect();
                tooltip.style.left = (rect.left + (rect.width / 2)) + 'px';
                tooltip.style.top = (rect.top - 10) + 'px';
            });
            
            item.addEventListener('mouseleave', () => {
                tooltip.classList.remove('show');
            });
        });

        window.addEventListener('scroll', () => {
            tooltip.classList.remove('show');
        });
    </script>
