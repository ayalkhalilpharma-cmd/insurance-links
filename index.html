<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mena's Online Directory</title>
    <style>
        :root {
            --bg-color: #f1f5f9;
            --text-main: #1e293b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
            padding-bottom: 40px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5rem;
            color: #334155;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Honeycomb Flex Layout */
        .honeycomb-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 20px;
            max-width: 1150px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Shadow Wrapper for Hexagons */
        .hex-wrapper {
            filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.15));
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .hex-wrapper:hover {
            transform: scale(1.12) translateY(-8px);
            filter: drop-shadow(0 15px 20px rgba(0, 0, 0, 0.3));
            z-index: 10;
        }

        /* The Hexagon Button Shape */
        .visit-btn {
            width: 170px;
            height: 195px;
            background-color: var(--clr);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            padding: 0 15px;
            line-height: 1.3;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: filter 0.3s;
        }

        .hex-wrapper:hover .visit-btn {
            filter: brightness(1.15);
        }

        /* --- Custom Retro Telephone Buttons --- */
        .phone-wrapper {
            filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.15));
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 170px;
            height: 195px;
        }

        .phone-wrapper:hover {
            transform: scale(1.15) translateY(-8px);
            filter: drop-shadow(0 15px 20px rgba(0, 0, 0, 0.3));
            z-index: 10;
        }

        .retro-phone {
            width: 155px;
            height: 155px;
            color: var(--phone-clr);
            transition: filter 0.3s;
        }

        .phone-wrapper:hover .retro-phone {
            filter: brightness(1.2);
        }

        /* --- F1 Keyboard Button Styles --- */
        .key-wrapper {
            width: 170px; 
            height: 195px;
            display: flex; 
            align-items: center; 
            justify-content: center;
            cursor: pointer;
            filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.2));
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .key-wrapper:hover {
            transform: scale(1.15);
            filter: drop-shadow(0 15px 20px rgba(0, 0, 0, 0.3));
            z-index: 10;
        }

        .key-3d {
            width: 110px; 
            height: 110px;
            background: linear-gradient(135deg, #f1f5f9, #cbd5e1);
            border-radius: 12px;
            border: 2px solid #94a3b8;
            box-shadow: 0 10px 0 #94a3b8, 0 12px 10px rgba(0,0,0,0.2), inset 2px 2px 5px rgba(255,255,255,0.8);
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-size: 3rem; 
            font-weight: 900; 
            font-family: Arial, sans-serif;
            color: #334155;
            transition: all 0.1s;
            text-decoration: none;
        }

        /* Animates physical button press! */
        .key-wrapper:hover .key-3d {
            transform: translateY(6px);
            box-shadow: 0 4px 0 #94a3b8, 0 4px 4px rgba(0,0,0,0.2), inset 2px 2px 5px rgba(255,255,255,0.8);
            background: linear-gradient(135deg, #ffffff, #e2e8f0);
            color: #0284c7;
        }

        /* --- Dx and Rx Text Shapes --- */
        .dx-rx-wrapper {
            width: 170px; 
            height: 195px;
            display: flex; 
            align-items: center; 
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .dx-rx-wrapper:hover {
            transform: scale(1.15) translateY(-8px);
            z-index: 10;
        }

        .symbol-text {
            font-family: 'Georgia', serif;
            font-size: 5.5rem;
            font-weight: bold;
            font-style: italic;
            color: var(--sym-clr);
            text-decoration: none;
            display: flex;
            align-items: flex-end;
            line-height: 1;
            filter: drop-shadow(0 6px 8px rgba(0,0,0,0.2));
            transition: all 0.3s;
        }

        .symbol-text sub {
            font-size: 3.5rem;
            margin-left: -5px;
            margin-bottom: 8px;
        }

        .dx-rx-wrapper:hover .symbol-text {
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3)) brightness(1.2);
            text-shadow: 0 0 20px var(--sym-clr);
        }

        /* Giant Center Clock Hexagon */
        .clock-wrapper {
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.1));
            margin: 10px 25px;
            z-index: 5;
        }

        .clock-hex {
            width: 300px;
            height: 345px;
            background-color: #ffffff;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        #clock-time {
            font-size: 2.8rem;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -1px;
            margin-bottom: 5px;
        }

        #clock-day {
            font-size: 1.4rem;
            font-weight: 700;
            color: #3b82f6; 
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        #clock-date {
            font-size: 1.1rem;
            color: #64748b;
            margin-top: 5px;
            font-weight: 600;
        }

        /* Tooltip Styles */
        .quote-tooltip {
            position: fixed;
            background-color: #1e293b;
            color: #f8fafc;
            padding: 0.85rem 1.2rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            transform: translate(-50%, -100%) translateY(10px);
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            width: max-content;
            max-width: 280px;
            line-height: 1.5;
        }

        .quote-tooltip.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -100%) translateY(0);
        }
    </style>

    <script>
        function updateClock() {
            const now = new Date();
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

            let h = now.getHours();
            let m = now.getMinutes();
            let s = now.getSeconds();
            let ampm = h >= 12 ? 'PM' : 'AM';
            
            h = h % 12;
            h = h ? h : 12;
            m = m < 10 ? '0' + m : m;
            s = s < 10 ? '0' + s : s;

            document.getElementById('clock-time').textContent = `${h}:${m}:${s} ${ampm}`;
            document.getElementById('clock-day').textContent = days[now.getDay()];
            document.getElementById('clock-date').textContent = `${now.getDate()} ${months[now.getMonth()]}, ${now.getFullYear()}`;
        }
        
        updateClock();
        setInterval(updateClock, 1000);

        const quotes = [
            "“The secret of getting ahead is getting started.”",
            "“Hard work beats talent when talent doesn't work hard.”",
            "“Don't watch the clock; do what it does. Keep going.”",
            "“Success is no accident. It is hard work and learning.”",
            "“Believe you can and you're halfway there.”",
            "“Your limitation—it's only your imagination.”",
            "“Push yourself, because no one else is going to do it for you.”",
            "“Great things never come from comfort zones.”",
            "“Dream it. Wish it. Do it.”",
            "“Stay focused, stay positive, and never give up.”"
        ];

        const tooltip = document.getElementById('quote-tooltip');
        
        // Ensure ALL wrappers (hex, phone, key, and dx/rx text shapes) trigger tooltips!
        const interactiveItems = document.querySelectorAll('.hex-wrapper, .phone-wrapper, .key-wrapper, .dx-rx-wrapper');

        interactiveItems.forEach(item => {
            item.addEventListener('mouseenter', () => {
                const title = item.getAttribute('data-title');
                const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
                
                // Display title + quote together on hover
                tooltip.innerHTML = `<strong style="color: #60a5fa; display: block; margin-bottom: 4px;">${title}</strong>${randomQuote}`;
                tooltip.classList.add('show');
                
                const rect = item.getBoundingClientRect();
                tooltip.style.left = (rect.left + (rect.width / 2)) + 'px';
                tooltip.style.top = (rect.top - 10) + 'px';
            });
            
            item.addEventListener('mouseleave', () => {
                tooltip.classList.remove('show');
            });
        });

        window.addEventListener('scroll', () => {
            tooltip.classList.remove('show');
        });
    </script>
